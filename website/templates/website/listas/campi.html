{% extends "website/modelo.html" %}

{% load static %}

{% block conteudo %}
<h2 class="border-bottom pb-2 mb-4">Lista de Campi</h2>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for campus in object_list %}
        <tr>
            <td>{{ campus.nome }}</td>
            <td>
                <a href="{% url "campus_detail" campus.pk %}" class="btn btn-info btn-sm">
                    🔎
                </a>
                <a href="{% url "campus_update" campus.pk %}" class="btn btn-primary btn-sm">
                    📝
                </a>
                <a href="{% url "campus_delete" campus.pk %}" class="btn btn-danger btn-sm">
                    🗑️
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock conteudo %}
