{% extends "website/modelo.html" %}

{% load static %}

{% block conteudo %}
<h2 class="border-bottom pb-2 mb-4">Lista de Fases</h2>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Jogos</th>
            <th>Sequência</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for fase in object_list %}
        <tr>
            <td>{{ fase.nome }}</td>
            <td>{{ fase.quantidade_jogos }}</td>
            <td>{{ fase.sequencia }}</td>
            <td>
                <a href="{% url "fase_detail" fase.pk %}" class="btn btn-info btn-sm">
                    🔎
                </a>
                <a href="{% url "fase_update" fase.pk %}" class="btn btn-primary btn-sm">
                    📝
                </a>
                <a href="{% url "fase_delete" fase.pk %}" class="btn btn-danger btn-sm">
                    🗑️
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock conteudo %}
